; IHC Bridge – firmware til ESP32-S3 (YD-ESP32-S3 / ESP32-S3-DevKitC-1, N16R8)
;
; Byg og flash:   pio run -e esp32s3 -t upload
; Seriel monitor: pio device monitor -e esp32s3
; Unit-tests:     pio test -e native

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Ren logik (frame-kodning, regler m.m.) testes på PC uden hardware.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra

; Testfirmware til logic analyzer: hvert outputmodul sender sit modulnummer.
; ADVARSEL: tilsluttede relæer skifter. Brug kun på prøvebord.
;   pio run -e esp32s3_bustest -t upload
[env:esp32s3_bustest]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DIHC_BUS_TEST
