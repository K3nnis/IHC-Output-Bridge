# ihc_moduler/modul_6.yaml

ihc_output:
  - id: m6
    pin: GPIO26

switch:
  - platform: template
    name: "IHCoutput 6.1"
    id: m6_u1
    turn_on_action:
      - lambda: |-
          id(m6).set_channel(1, true);
          id(m6_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m6).set_channel(1, false);
          id(m6_u1).publish_state(false);

