# ihc_moduler/modul_7.yaml

ihc_output:
  - id: m7
    pin: GPIO27

switch:
  - platform: template
    name: "IHCoutput 7.1"
    id: m7_u1
    turn_on_action:
      - lambda: |-
          id(m7).set_channel(1, true);
          id(m7_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m7).set_channel(1, false);
          id(m7_u1).publish_state(false);

