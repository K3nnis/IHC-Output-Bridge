# ihc_moduler/modul_12.yaml

ihc_output:
  - id: m12
    pin: GPIO21

switch:
  - platform: template
    name: "IHCoutput 12.1"
    id: m12_u1
    turn_on_action:
      - lambda: |-
          id(m12).set_channel(1, true);
          id(m12_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m12).set_channel(1, false);
          id(m12_u1).publish_state(false);

