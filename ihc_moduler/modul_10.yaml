# ihc_moduler/modul_10.yaml

ihc_output:
  - id: m10
    pin: GPIO18

switch:
  - platform: template
    name: "IHCoutput 10.1"
    id: m10_u1
    turn_on_action:
      - lambda: |-
          id(m10).set_channel(1, true);
          id(m10_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m10).set_channel(1, false);
          id(m10_u1).publish_state(false);

