# ihc_moduler/modul_3.yaml

ihc_output:
  - id: m3
    pin: GPIO16

switch:
  - platform: template
    name: "IHCoutput 3.1"
    id: m3_u1
    turn_on_action:
      - lambda: |-
          id(m3).set_channel(1, true);
          id(m3_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m3).set_channel(1, false);
          id(m3_u1).publish_state(false);

