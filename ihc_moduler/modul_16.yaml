# ihc_moduler/modul_16.yaml

ihc_output:
  - id: m16
    pin: GPIO5

switch:
  - platform: template
    name: "IHCoutput 16.1"
    id: m16_u1
    turn_on_action:
      - lambda: |-
          id(m16).set_channel(1, true);
          id(m16_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m16).set_channel(1, false);
          id(m16_u1).publish_state(false);

