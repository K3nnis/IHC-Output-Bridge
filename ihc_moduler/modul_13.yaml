# ihc_moduler/modul_13.yaml

ihc_output:
  - id: m13
    pin: GPIO22

switch:
  - platform: template
    name: "IHCoutput 13.1"
    id: m13_u1
    turn_on_action:
      - lambda: |-
          id(m13).set_channel(1, true);
          id(m13_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m13).set_channel(1, false);
          id(m13_u1).publish_state(false);

