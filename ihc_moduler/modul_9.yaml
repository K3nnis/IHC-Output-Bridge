# ihc_moduler/modul_9.yaml

ihc_output:
  - id: m9
    pin: GPIO4

switch:
  - platform: template
    name: "IHCoutput 9.1"
    id: m9_u1
    turn_on_action:
      - lambda: |-
          id(m9).set_channel(1, true);
          id(m9_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m9).set_channel(1, false);
          id(m9_u1).publish_state(false);

