# ihc_moduler/modul_111.yaml

ihc_output:
  - id: m11
    pin: GPIO19

switch:
  - platform: template
    name: "IHCoutput 11.1"
    id: m11_u1
    turn_on_action:
      - lambda: |-
          id(m11).set_channel(1, true);
          id(m11_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m11).set_channel(1, false);
          id(m11_u1).publish_state(false);

