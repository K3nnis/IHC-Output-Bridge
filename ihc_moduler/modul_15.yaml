# ihc_moduler/modul_15.yaml

ihc_output:
  - id: m15
    pin: GPIO33

switch:
  - platform: template
    name: "IHCoutput 15.1"
    id: m15_u1
    turn_on_action:
      - lambda: |-
          id(m15).set_channel(1, true);
          id(m15_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m15).set_channel(1, false);
          id(m15_u1).publish_state(false);

