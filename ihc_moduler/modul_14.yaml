# ihc_moduler/modul_14.yaml

ihc_output:
  - id: m14
    pin: GPIO23

switch:
  - platform: template
    name: "IHCoutput 14.1"
    id: m14_u1
    turn_on_action:
      - lambda: |-
          id(m14).set_channel(1, true);
          id(m14_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m14).set_channel(1, false);
          id(m14_u1).publish_state(false);

