# ihc_moduler/modul_1.yaml

ihc_output:
  - id: m1
    pin: GPIO13

switch:
  - platform: template
    name: "IHCoutput 1.1"
    id: m1_u1
    turn_on_action:
      - lambda: |-
          id(m1).set_channel(1, true);
          id(m1_u1).publish_state(true);
    turn_off_action:
      - lambda: |-
          id(m1).set_channel(1, false);
          id(m1_u1).publish_state(false);

