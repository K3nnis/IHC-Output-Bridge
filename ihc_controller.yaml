esphome:
  name: ihc-output-bridge
  friendly_name: "IHC Output Bridge"

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "IHC Output Bridge"
    password: ""

ota:
  - platform: esphome
    password: !secret ota_password

logger:

web_server:
    port: 80
    
api:
  password: !secret api_password
  
mqtt:
  broker: 192.168.1.15
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: ihc_bridge

external_components:
  - source:
      type: local
      path: custom_components

# =======================================================
# HER STYRER DU, HVILKE MODULER DER ER AKTIVE
# Sæt et '#' foran dem, du ikke vil bruge lige nu.
# =======================================================
packages:
  modul_1: !include ihc_moduler/modul_1.yaml
  modul_2: !include ihc_moduler/modul_2.yaml
  modul_3: !include ihc_moduler/modul_3.yaml
  modul_4: !include ihc_moduler/modul_4.yaml
